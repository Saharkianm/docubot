<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DocuBot</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f7f7f8;
  }
  h1 { font-size: 20px; }
  #chat-log {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    min-height: 300px;
    max-height: 500px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .msg { margin-bottom: 16px; }
  .msg .who { font-weight: 600; font-size: 13px; color: #555; }
  .msg .text { white-space: pre-wrap; margin-top: 4px; }
  .sources { font-size: 12px; color: #888; margin-top: 4px; }
  #input-row { display: flex; gap: 8px; }
  #question { flex: 1; padding: 10px; font-size: 14px; }
  button { padding: 10px 16px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<h1>DocuBot — FastAPI Docs Assistant</h1>
<div id="chat-log"></div>

<div id="input-row">
  <input id="question" type="text" placeholder="Ask about FastAPI..." />
  <button id="send-btn">Send</button>
</div>

<script>
  // Where your FastAPI server is running (from Step 3)
  const API_URL = "http://127.0.0.1:8000/chat";

  const chatLog = document.getElementById("chat-log");
  const questionInput = document.getElementById("question");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(who, text, sources) {
    const div = document.createElement("div");
    div.className = "msg";
    let html = `<div class="who">${who}</div><div class="text">${text}</div>`;
    if (sources && sources.length > 0) {
      html += `<div class="sources">Sources: ${sources.join(", ")}</div>`;
    }
    div.innerHTML = html;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight; // auto-scroll to newest message
  }

  async function sendQuestion() {
    const question = questionInput.value.trim();
    if (!question) return;

    addMessage("You", question);
    questionInput.value = "";
    sendBtn.disabled = true;
    addMessage("DocuBot", "Thinking... (small local models can take a while)");

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question }),
      });

      if (!response.ok) {
        throw new Error(`Server responded with status ${response.status}`);
      }

      const data = await response.json();

      // Remove the "Thinking..." placeholder before showing the real answer
      chatLog.removeChild(chatLog.lastChild);
      addMessage("DocuBot", data.answer, data.sources);
    } catch (err) {
      chatLog.removeChild(chatLog.lastChild);
      addMessage("DocuBot", "Error: " + err.message + " — is api.py running?");
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendQuestion);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendQuestion();
  });
</script>

</body>
</html>
